name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: bash ./gradlew :composeApp:assembleFreeDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qBitController-debug
          path: composeApp/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
          retention-days: 3
name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: bash ./gradlew :composeApp:assembleFreeDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qBitController-debug
          path: composeApp/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
          retention-days: 3
